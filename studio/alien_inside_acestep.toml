# gl1tch.mary — "Alien Inside" (ACE-Step demo, matches Suno EP palette)
config_path = "acestep-v15-turbo"
lm_model_path = "acestep-5Hz-lm-0.6B"
checkpoint_dir = "checkpoints"
backend = "mlx"
device = "mps"
save_dir = "output"
audio_format = "wav"

task_type = "text2music"
caption = "dark electronic, glitch pop, industrial, cold haunting female vocals, brooding mid-tempo, distorted synth bass, glitchy clicking percussion, atmospheric pads, cinematic, uncanny, gothic, 95 bpm"

